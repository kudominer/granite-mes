# Netlify config cho granite-mes (app HTML tĩnh)
[build]
  publish = "."          # thư mục chứa file web (gốc repo)
  command = ""           # không cần build (HTML thuần)

# Trang chủ mặc định
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

